name: StudyBuddy CI

on:
  push:
    branches: [ main, dev, 'feature/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --experimental-vm-modules

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install Dependencies
      run: |
        npm install
        npm run install:all

    - name: Lint Frontend
      run: |
        cd client && npm run lint

    - name: Build Frontend
      run: |
        cd client && npm run build

    - name: Run Client Smoke Tests (Vitest)
      run: |
        cd client && npm test

    - name: Run Server Test Suite (Jest Supertest)
      run: |
        cd server && npm test

    - name: Run Programmatic Chatbot Test Runner (21 Cases)
      run: |
        node server/scripts/run-chat-tests.js
