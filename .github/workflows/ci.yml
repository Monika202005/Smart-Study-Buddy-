name: StudyBuddy CI

on:
  push:
    branches: [ main, dev, 'feature/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Install Dependencies
      run: |
        npm install
        npm run install:all

    - name: Lint Frontend
      run: |
        cd client && npm run lint

    - name: Build Frontend
      run: |
        npm run build

    - name: Run Server Test Suite
      run: |
        cd server && npm test
